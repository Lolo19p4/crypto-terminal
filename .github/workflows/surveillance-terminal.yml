name: Surveillance du terminal public

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'ancien-bot-fonds.html'
      - 'index.html'
      - '.github/workflows/surveillance-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surveillance-terminal
  cancel-in-progress: true

jobs:
  lecture-et-controles:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Valider la page et le JavaScript
        shell: bash
        run: |
          test -s index.html
          test -s ancien-bot-fonds.html
          grep -q 'href="ancien-bot-fonds.html"' index.html
          node <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('ancien-bot-fonds.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error('Script de lecture absent');
          new vm.Script(script[1], {filename: 'ancien-bot-fonds-inline.js'});
          console.log('Page et JavaScript présents, syntaxe valide.');
          JS
      - name: Tester la publication GitHub Pages
        shell: bash
        run: |
          set -e
          for url in "https://lolo19p4.github.io/crypto-terminal/" "https://lolo19p4.github.io/crypto-terminal/ancien-bot-fonds.html"; do
            echo "Test HTTP public: $url"
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors --connect-timeout 12 --max-time 22 "$url")"
            echo "HTTP $code"
            test "$code" = "200"
          done
      - name: Vérifier la fraîcheur du signal Sol Desk
        shell: bash
        run: |
          python3 <<'PY'
          from datetime import datetime, timezone
          import json
          import urllib.request
          url = 'https://raw.githubusercontent.com/Lolo19p4/sol-desk/master/status.json'
          with urllib.request.urlopen(url, timeout=20) as res:
              data = json.load(res)
          print('Dernier état déclaré:', data.get('dernier_passage'))
          print('Positions déclarées:', data.get('nb_positions', 'inconnu'))
          dt = datetime.fromisoformat(data['dernier_passage'])
          age_min = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds() / 60
          if age_min < -5:
              print('::warning::Horodatage Sol Desk dans le futur, état non confirmé.')
          elif age_min > 30:
              print('::warning::Sol Desk: état publié ancien de %.1f min. Impossible de certifier que le bot fonctionne.' % age_min)
          else:
              print('Signal publié récemment, sans preuve de processus encore actif.')
          PY
